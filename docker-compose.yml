services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jobpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis is not required by V0. Uncomment when a future version needs
  # caching, job queues, or rate limiting.
  # redis:
  #   image: redis:7-alpine
  #   container_name: jobpilot-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

volumes:
  jobpilot_postgres_data:
